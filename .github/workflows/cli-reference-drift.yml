name: CLI Reference Drift Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  drift:
    name: CLI Reference Drift
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version-file: go.mod

      - name: Generate CLI reference
        run: go run ./cmd/gen-docs docs/cli-reference

      - name: Check for drift
        run: |
          if ! git diff --exit-code docs/cli-reference/; then
            echo "::error::CLI reference docs are out of date. Run 'make docs' locally and commit the updated files."
            exit 1
          fi
