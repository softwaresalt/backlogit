name: CI

# Required-check invariant: Detect code changes, test, and Docline frontmatter gate
# must report on every pull request. Do not add trigger-level paths filters to
# this workflow; gate expensive steps inside always-reporting jobs instead.
# PR-only validation removes duplicate push-to-main runs. Keep branch protection
# requiring up-to-date branches, or add merge_group if a merge queue is adopted.
on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.classify.outputs.code }}
      docline_required: ${{ steps.classify.outputs.docline_required }}
      plugin_bundle: ${{ steps.plugin.outputs.plugin_bundle }}
      cli_reference: ${{ steps.cli.outputs.cli_reference }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Classify code and docline changes
        id: classify
        uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        with:
          # 'every' makes the negated allowlist fail safe: unknown paths run
          # heavy verification instead of silently skipping required gates.
          predicate-quantifier: 'every'
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!.backlogit/**'
            # Docline lint runs for docs/frontmatter files and unknown path
            # classes. It skips only known non-docline code/test domains.
            docline_required:
              - '**'
              - '!internal/db/**'
              - '!internal/mcp/**'
              - '!internal/models/**'
              - '!internal/telemetry/**'
              - '!internal/version/**'
              - '!tests/**'
              - '!.backlogit/**'
      - name: Classify plugin bundle changes
        id: plugin
        uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        with:
          filters: |
            plugin_bundle:
              - 'plugin/**'
              - '.github/plugin/**'
              - 'tests/integration/plugin_manifest_test.go'
              - 'Makefile'
              - 'make.ps1'
      - name: Detect CLI reference changes
        id: cli
        uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        with:
          filters: |
            cli_reference:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'go.work'
              - 'go.work.sum'
              - 'cmd/gen-docs/**'
              - 'docs/cli-reference/**'
              - '.github/workflows/ci.yml'

  test:
    needs: changes
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Skip Go gates for docs/backlog-only changes
        if: needs.changes.outputs.code == 'false' && needs.changes.outputs.plugin_bundle == 'false'
        run: echo "Skipping Go gates because the PR only changed docs, Markdown, or backlog state outside the plugin bundle."
      - name: Checkout
        if: needs.changes.outputs.code != 'false' || needs.changes.outputs.plugin_bundle != 'false'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup Go 1.24
        if: needs.changes.outputs.code != 'false' || needs.changes.outputs.plugin_bundle != 'false'
        uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          # Go 1.24 is the authoritative support target for race and coverage.
          go-version: "1.24"
      - name: Install dependencies
        if: needs.changes.outputs.code != 'false' || needs.changes.outputs.plugin_bundle != 'false'
        run: go mod download
      - name: Lint
        if: needs.changes.outputs.code != 'false' || needs.changes.outputs.plugin_bundle != 'false'
        uses: golangci/golangci-lint-action@2226d7cb06a077cd73e56eedd38eecad18e5d837 # v6.5.0
        with:
          version: v1.64.8
          args: --timeout=5m
      - name: Vet
        if: needs.changes.outputs.code != 'false' || needs.changes.outputs.plugin_bundle != 'false'
        run: go vet ./...
      - name: Test
        if: needs.changes.outputs.code != 'false' || needs.changes.outputs.plugin_bundle != 'false'
        run: go test -race -coverprofile=coverage.out ./...
      - name: Coverage report
        if: needs.changes.outputs.code != 'false' || needs.changes.outputs.plugin_bundle != 'false'
        run: go tool cover -func=coverage.out

  docs-lint:
    name: Docline frontmatter gate
    needs: changes
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Skip docline lint for code-only changes
        if: needs.changes.outputs.docline_required == 'false'
        run: echo "Skipping docline lint for known non-docline code/test-only changes."
      - name: Checkout
        if: needs.changes.outputs.docline_required != 'false'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup Go for docline lint
        if: needs.changes.outputs.docline_required != 'false'
        uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version-file: go.mod
      - name: Lint documentation frontmatter
        if: needs.changes.outputs.docline_required != 'false'
        run: make docs-lint
      - name: Enforce docline soft keys on tracked corpus
        if: needs.changes.outputs.docline_required != 'false'
        run: go test ./tests/integration/ -run '^TestDoclineSoftKeys_LiveTrackedCorpus$' -count=1

  cli-reference-drift:
    name: CLI Reference Drift
    needs: changes
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Skip CLI reference drift for irrelevant changes
        if: needs.changes.outputs.cli_reference == 'false'
        run: echo "Skipping CLI reference drift because CLI-affecting files were not changed."
      - name: Checkout
        if: needs.changes.outputs.cli_reference != 'false'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup Go for CLI reference
        if: needs.changes.outputs.cli_reference != 'false'
        uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version-file: go.mod
      - name: Generate CLI reference
        if: needs.changes.outputs.cli_reference != 'false'
        run: go run ./cmd/gen-docs docs/cli-reference
      - name: Check for drift
        if: needs.changes.outputs.cli_reference != 'false'
        run: |
          if ! git diff --exit-code docs/cli-reference/; then
            echo "::error::CLI reference docs are out of date. Run 'make docs' locally and commit the updated files."
            exit 1
          fi

  md-lint:
    name: Markdown lint (P-008)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # markdownlint-cli2@0.23.1 declares engines.node ">=22"; match it so the
          # required gate runs on a supported runtime.
          node-version: "22"
      - name: Run markdownlint (P-008 MD001/MD025/MD041, repo-wide)
        run: make md-lint

  # Pipeline-topology CI backstop (Gate C, P-001/P-016/P-019). Always runs; it is
  # deliberately NOT gated on the `changes` path filter, because docs/backlog-only
  # commits are the ones most likely to touch `.backlogit/` topology state.
  #
  # Required-vs-advisory is an operator toggle, not a re-render: leaving the
  # PIPELINE_TOPOLOGY_GATE_REQUIRED repository variable unset keeps this job
  # advisory (non-blocking); setting it to 'true' flips it to blocking.
  topology-check:
    name: pipeline-topology (ambient)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: ${{ vars.PIPELINE_TOPOLOGY_GATE_REQUIRED != 'true' }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - name: Install autoharness
        # Pinned deliberately. An unpinned `pip install autoharness` resolves
        # whatever PyPI publishes as latest on every run, so a later release
        # could change pipeline-topology gate semantics — or break this job —
        # with no change to this repository.
        #
        # Keep this pin in step with the version merge-installed into this
        # workspace (see .autoharness/harness-manifest.yaml). The gate invoked
        # by scripts/ci-topology-check.sh is `autoharness gate pipeline-topology`,
        # which does not exist before 1.5.0 — pinning below that floor makes this
        # job exit 2 with "Unknown gate subcommand".
        run: pip install 'autoharness==1.5.0'
      - name: Run CI topology-check entrypoint
        run: bash scripts/ci-topology-check.sh
