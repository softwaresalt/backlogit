name: CI

# Required-check invariant: Detect code changes, test, and Docline frontmatter gate
# must report on every pull request. Do not add trigger-level paths filters to
# this workflow; gate expensive steps inside always-reporting jobs instead.
# PR-only validation removes duplicate push-to-main runs. Keep branch protection
# requiring up-to-date branches, or add merge_group if a merge queue is adopted.
on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.classify.outputs.code }}
      docline_required: ${{ steps.classify.outputs.docline_required }}
      cli_reference: ${{ steps.cli.outputs.cli_reference }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Classify code and docline changes
        id: classify
        uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        with:
          # 'every' makes the negated allowlist fail safe: unknown paths run
          # heavy verification instead of silently skipping required gates.
          predicate-quantifier: 'every'
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!.backlogit/**'
            # Docline lint runs for docs/frontmatter files and unknown path
            # classes. It skips only known non-docline code/test domains.
            docline_required:
              - '**'
              - '!internal/core/**'
              - '!internal/db/**'
              - '!internal/mcp/**'
              - '!internal/models/**'
              - '!internal/telemetry/**'
              - '!internal/version/**'
              - '!tests/**'
      - name: Detect CLI reference changes
        id: cli
        uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        with:
          filters: |
            cli_reference:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'go.work'
              - 'go.work.sum'
              - 'cmd/gen-docs/**'
              - 'docs/cli-reference/**'
              - '.github/workflows/ci.yml'

  test:
    needs: changes
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Skip Go gates for docs/backlog-only changes
        if: needs.changes.outputs.code == 'false'
        run: echo "Skipping Go gates because the PR only changed docs, Markdown, or backlog state."
      - name: Checkout
        if: needs.changes.outputs.code != 'false'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup Go 1.24
        if: needs.changes.outputs.code != 'false'
        uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          # Go 1.24 is the authoritative support target for race and coverage.
          go-version: "1.24"
      - name: Install dependencies
        if: needs.changes.outputs.code != 'false'
        run: go mod download
      - name: Lint
        if: needs.changes.outputs.code != 'false'
        uses: golangci/golangci-lint-action@2226d7cb06a077cd73e56eedd38eecad18e5d837 # v6.5.0
        with:
          version: v1.64.8
          args: --timeout=5m
      - name: Vet
        if: needs.changes.outputs.code != 'false'
        run: go vet ./...
      - name: Test
        if: needs.changes.outputs.code != 'false'
        run: go test -race -coverprofile=coverage.out ./...
      - name: Coverage report
        if: needs.changes.outputs.code != 'false'
        run: go tool cover -func=coverage.out

  docs-lint:
    name: Docline frontmatter gate
    needs: changes
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Skip docline lint for code-only changes
        if: needs.changes.outputs.docline_required == 'false'
        run: echo "Skipping docline lint for known non-docline code/test-only changes."
      - name: Checkout
        if: needs.changes.outputs.docline_required != 'false'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup Go for docline lint
        if: needs.changes.outputs.docline_required != 'false'
        uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version-file: go.mod
      - name: Lint documentation frontmatter
        if: needs.changes.outputs.docline_required != 'false'
        run: make docs-lint

  cli-reference-drift:
    name: CLI Reference Drift
    needs: changes
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Skip CLI reference drift for irrelevant changes
        if: needs.changes.outputs.code == 'false' && needs.changes.outputs.cli_reference == 'false'
        run: echo "Skipping CLI reference drift because CLI-affecting files were not changed."
      - name: Checkout
        if: needs.changes.outputs.code != 'false' || needs.changes.outputs.cli_reference == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup Go for CLI reference
        if: needs.changes.outputs.code != 'false' || needs.changes.outputs.cli_reference == 'true'
        uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version-file: go.mod
      - name: Generate CLI reference
        if: needs.changes.outputs.code != 'false' || needs.changes.outputs.cli_reference == 'true'
        run: go run ./cmd/gen-docs docs/cli-reference
      - name: Check for drift
        if: needs.changes.outputs.code != 'false' || needs.changes.outputs.cli_reference == 'true'
        run: |
          if ! git diff --exit-code docs/cli-reference/; then
            echo "::error::CLI reference docs are out of date. Run 'make docs' locally and commit the updated files."
            exit 1
          fi
