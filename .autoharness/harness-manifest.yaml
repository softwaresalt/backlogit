variables_used:
  # --- Added 2026-08-31 (1.5.0 merge-install gap pass) ---
  # Bindings required by the newly installed doc-review skill, the P-019 pre-push
  # gate scripts, deploy-harness, and start.sh. Values match exactly what was
  # rendered into the installed artifacts so the deterministic verifier's
  # re-render reproduces them byte-for-byte.
  #
  # ALT_DOC_REVIEW_* are intentionally EMPTY: config.yaml declares no
  # model_routing.alt_doc_review block, and the already-installed
  # adversarial-review.instructions.md uses the same empty-render convention.
  # Configure model_routing.alt_doc_review to bind a concrete alternate model.
  ALT_DOC_REVIEW_PROVIDER: "google"
  ALT_DOC_REVIEW_FAMILY: "gemini-3.1-pro-preview"
  LINT_TOOL: "golangci-lint"
  FORMAT_TOOL: "gofmt"
  # Go has no distinct typecheck binary; `go vet ./...` is Gate 2 in AGENTS.md and
  # a discovered value in the profile's ci.quality_gates, so the gate line is kept
  # rather than dropped.
  TYPECHECK_TOOL: "go"
  TYPECHECK_COMMAND: "go vet ./..."
  TEST_TOOL: "go"
  DEFAULT_PRESET: "full"
  DEFAULT_REGISTER_ENV: "copilot-cli"
  DEFAULT_INSTALL_METHOD: "pip"
  AUTOHARNESS_HOME_DEFAULT: "$HOME/.autoharness"
  PACK_REGISTRY_PATH: "templates/packs/capability-pack-registry.yaml"
  COPILOT_EXE_PATH: "copilot"
  INSTALL_PRESET: "full"
  CAPABILITY_PACKS: "backlogit,strict-safety,agent-engram,adversarial-review,release-observability,continuous-learning,graphtor-docs"
  # --- Added 2026-08-31 (continuous-learning + graphtor-docs pack enablement) ---
  # CONTINUOUS_LEARNING_* resolve from config.yaml `continuous_learning`.
  # GRAPHTOR_* resolve from workspace-profile.yaml `graphtor_docs`.
  # Values match exactly what was rendered into the installed instruction files.
  CONTINUOUS_LEARNING_DIR: ".autoharness/continuous-learning"
  CONTINUOUS_LEARNING_CAPTURE_HOOKS: "false"
  CONTINUOUS_LEARNING_ENVIRONMENT_ADAPTER: "none"
  CONTINUOUS_LEARNING_PROMOTION_THRESHOLD: "5"
  GRAPHTOR_SOURCES_PATH: ".graphtor/config/sources.yaml"
  GRAPHTOR_BINARY_PATH: ".graphtor/bin/graphtor-docs.exe"
  BACKLOG_TOOL_NAME: "backlogit"
  BACKLOG_DIRECTORY: ".backlogit"
  PREFIX_FEATURE: "F"
  PREFIX_TASK: "T"
  PREFIX_DELIBERATION: "DL"
  PREFIX_REVIEW: "R"
  PREFIX_BUG: "B"
  PREFIX_SUBTASK: "ST"
  DOCS_ROOT: "docs"
  DOCS_COMPOUND_DIR: "compound"
  DOCS_PLANS_DIR: "exec-plans"
  DOCS_DECISIONS_DIR: "decisions"
  DOCS_MEMORY_DIR: "memory"
  DOCS_CLOSURE_DIR: "closure"
  DOCS_DESIGN_DOCS_DIR: "design-docs"
  DOCS_PRODUCT_SPECS_DIR: "product-specs"
  MODEL_ROUTING_TIER1: "Claude Haiku 4.5"
  MODEL_ROUTING_TIER2: "Claude Sonnet 4.6"
  MODEL_ROUTING_TIER3: "Claude Opus 4.6"
  PRIMARY_LANGUAGE: "Go"
  LANGUAGE_VERSION: "1.24.0"
  BUILD_COMMAND: "go build ./cmd/backlogit"
  TEST_COMMAND: "go test ./..."
  LINT_COMMAND: "golangci-lint run"
  FORMAT_COMMAND: "gofmt -l ."
  CI_PLATFORM: "GitHub Actions"
  SOURCE_LAYOUT: "cmd/, internal/, tests/"
  TEST_LAYOUT: "tests/ and colocated *_test.go files"
  DOC_LAYOUT: "docs/"
  TECHNOLOGY_AGENT: "go-engineer"
  TECHNOLOGY_REVIEWER: "go-quality-reviewer"
  TECHNOLOGY_INSTRUCTIONS: "go.instructions.md"
  MCP_SDK: "github.com/mark3labs/mcp-go"
  MCP_TRANSPORT: "stdio"
  AGENT_INTERCOM_DETECTED: "false"
  AGENT_ENGRAM_DETECTED: "true"
  BACKLOG_TOOL_TYPE: "both"
  BACKLOG_MCP_REGISTERED: "true"
  BACKLOG_CLI_AVAILABLE: "true"
  BACKLOG_CONFIG_PATH: ".backlogit/config.yaml"
  BACKLOG_REGISTRY_PATH: ".autoharness/backlog-registry.yaml"
  COMMIT_STYLE: "conventional commits"
  WORKSPACE_PATH: "d:\\Source\\GitHub\\backlogit"
  REPO_OWNER: "softwaresalt"
  REPO_NAME: "backlogit"
  ALT_REVIEW_PROVIDER: ""
  ALT_REVIEW_FAMILY: ""
  ANCHOR_REVIEW_PROVIDER: "openai"
  ANCHOR_REVIEW_FAMILY: "gpt-5.6-sol"
  ANCHOR_REVIEW_REASONING_EFFORT: "high"
  # P-013.6 auto-escalation route. Mirrors config.model_routing.escalation and is
  # deliberately a distinct provider/family from tier3 so Stage (already tier3) never
  # resolves a same-route ESCALATION_DEGRADED no-op. The tier3 per-field fallback
  # (claude-opus-4.8 / anthropic / high) remains the final fallback when no flat or
  # nested escalation override is declared.
  ESCALATION_FAMILY: "gpt-5.4"
  ESCALATION_PROVIDER: "openai"
  ESCALATION_REASONING_EFFORT: "high"
  PROJECT_NAME: "backlogit"
  HARNESS_ENFORCED_SUMMARY: |
    * Go formatting, linting, and vet mechanics (`gofmt -l .`, `golangci-lint run`, `go vet ./...`)
    * Workflow policies P-001 through P-021 and constitutional principle sequencing
    * Test-first red-green gate mechanics (P-002, P-004) and the `go test ./...` suite run
    * Merge-commit-only discipline (P-009, Principle XI) — squash and rebase are forbidden
    * Role-boundary enforcement (P-010) and single-worktree topology (P-016)
    * Backlog and shipment bookkeeping conventions (backlogit)
    * Template variable-completeness and cross-reference integrity checks
  HARNESS_MANIFEST_PATH: ".autoharness/harness-manifest.yaml"
  AUTOHARNESS_VERSION: "1.5.0"
  VARIABLE: "template variable"
  LANGUAGE_FILE_GLOB: "**/*.go"
  LANGUAGE_VERSION_DETAIL: "Go 1.24.0"
  FILE_EXT: "go"
  UNIMPLEMENTED_MARKER: 'panic("not implemented")'
  SOURCE_DIR: "internal"
  NAMING_RULES: |
    - Use MixedCaps/mixedCaps, never underscores, for all identifiers (types, functions, variables).
    - Exported identifiers get a doc comment starting with the identifier name.
    - Keep receiver names short and consistent across a type's methods (e.g., `s *Server`).
    - Package names are short, lowercase, and singular (e.g., `mcp`, `core`, `db`).
  CODE_ORGANIZATION_RULES: |
    - Keep the `cmd/`, `internal/`, `tests/` split: `cmd/` wires the CLI/MCP entrypoint, `internal/` holds
      unexported implementation packages, `tests/` and colocated `*_test.go` files hold coverage.
    - Group by responsibility (`internal/core`, `internal/db`, `internal/mcp`, `internal/events`), not by type.
    - Keep package boundaries aligned with the CQRS split between Markdown source of truth and the SQLite cache.
  ERROR_HANDLING_RULES: |
    - Never ignore an error return; either handle it or wrap and return it with `fmt.Errorf("...: %w", err)`.
    - No `panic()` in library code; return errors to the caller instead.
    - Do not use silent success-shaped fallbacks that swallow a real failure.
  SAFETY_RULES: |
    - Reject unsafe path construction; use canonical path handling and reject path traversal or untrusted relative paths.
    - Keep strong types at package boundaries; avoid unnecessary `any`, and prefer explicit type assertions or
      conversion helpers over `fmt.Sprintf("%v", value)` coercion at `map[string]any`/YAML-decoded boundaries.
    - Pass `context.Context` explicitly to I/O or blocking work; avoid global mutable state.
  PERFORMANCE_RULES: |
    - Avoid unnecessary allocations in hot MCP tool-handling paths; prefer preallocated slices/maps when size is known.
    - Use parameterized SQL queries and existing indexes rather than full-table scans in `internal/db`.
    - Avoid `fmt.Sprintf` in tight loops when a cheaper string-building approach is available.
  TESTING_RULES: |
    - Prefer `go test ./...` as the baseline validation command, with tests colocated as `*_test.go` alongside
      the package under test, plus scenario coverage under `tests/`.
    - Cover MCP tool schemas, outputs, and error behavior; rehydration/index rebuild behavior; and queue, stash,
      dependency, and migration logic when those areas change.
  DOCUMENTATION_RULES: |
    - Every exported identifier has a doc comment beginning with its name, per `go doc` convention.
    - Prefer `log/slog` structured logging documentation over ad hoc comments describing log output.
  DEPENDENCY_RULES: |
    - Prefer the standard library unless an added dependency is clearly justified.
    - Keep `go.mod`/`go.sum` consistent with the checked-in dependency set; do not introduce an unpinned dependency.
  ANTI_PATTERNS: |
    - No `panic()` in library code; no ignored errors or silent success-shaped fallbacks.
    - No `fmt.Println`/ad hoc logging in place of `log/slog`.
    - No unparameterized SQL or bypass of the read-only gate around `backlogit_query_sql`.
    - No writes outside the intended workspace root or `.backlogit` storage boundary.
  LANGUAGE_SAFETY_CHECKS: |
    - Flag ignored errors, silent success-shaped fallbacks, and `panic()` in library code.
    - Flag unsafe path construction, path-traversal risk, and untrusted relative paths.
  LANGUAGE_IDIOM_CHECKS: |
    - Flag non-MixedCaps identifiers, missing doc comments on exported identifiers, and inconsistent receiver names.
    - Flag `any` used where a concrete or generic type would keep the boundary strongly typed.
  LANGUAGE_ERROR_HANDLING_CHECKS: |
    - Flag unwrapped errors that lose context (`return err` instead of `fmt.Errorf("...: %w", err)`).
    - Flag error values compared with `==` instead of `errors.Is`/`errors.As` where wrapping is in play.
  LANGUAGE_PERFORMANCE_CHECKS: |
    - Flag unnecessary allocations or copies in MCP tool-handling and database query paths.
    - Flag missing `context.Context` propagation on I/O or blocking calls.
  AGENTIC_CONFIG_GLOB: ".github/**,.vscode/**"
  SOURCE_GLOB: "cmd/**,internal/**"
  DOCS_SECURITY: "docs/security"
  SECURITY_CONFIG_RULES: |
    - GitHub Copilot CLI / VS Code: check `.github/` instruction and agent files for overly permissive
      allow-lists or missing input validation, and `.vscode/settings.json` for terminal auto-approve patterns.
    - All environments: flag hardcoded credentials, unpinned secrets, and debug endpoints left enabled.
  SECURITY_OWASP_PATTERNS: |
    - `fmt.Sprintf`-built SQL instead of parameterized queries in `internal/db`.
    - `exec.Command` invoked with unsanitized user-supplied input.
    - Unsafe path joins that could permit path traversal outside the workspace/`.backlogit` boundary.
  SECURITY_SCAN_PATTERNS: |
    - Combine the Go OWASP patterns above with MCP-specific signals: unauthenticated stdio tool exposure,
      overly broad tool inputs, and any tool handler that bypasses the read-only gate on `backlogit_query_sql`.
  SECURITY_REVIEW_PATTERNS: |
    - File globs: `internal/mcp/**`, `internal/db/**`, `internal/core/**`, `internal/events/**`, `**/auth*.go`,
      `**/middleware*.go`.
    - Keywords: `login`, `token`, `password`, `permission`, `role`, `secret`, `key`, `credential`.
