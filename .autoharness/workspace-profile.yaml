# Runtime validation contract (added by Auto-Tune 1.4.11 adoption).
# No web/API/background runtime surfaces are declared for this CLI/MCP tool, so
# surfaces are empty and runtime validation is not release-blocking; the Go test
# suite and gate broker cover correctness. Downstream Ship / runtime-verification /
# operational-closure consume validator_manifest, validation_expectations, and
# releasability.
runtime_validation:
  validator_manifest:
    surfaces: []
  validation_expectations:
    required: false
    surfaces_expected: []
    minimum_verdict: "PASS"
    preserve_invariants: []
    release_blockers: []
  releasability:
    required: true
    status_when_satisfied: "READY"
    required_evidence:
      - kind: "monitoring-plan"
        required: false
      - kind: "rollback-procedure"
        required: false
      - kind: "owner"
        required: false

# P-018 Copilot review completion & thread-resolution merge gate configuration.
# Consumed by Ship Step 5 item 7c and the pr-lifecycle skill. `enforcement: required`
# forces the gate on regardless of per-PR engagement signal (under `auto` a PR with no
# Copilot engagement resolves NOT_APPLICABLE and would not hold the merge).
# `max_wait_seconds: 900` bounds how long the gate polls for an engaged reviewer to
# complete for the current HEAD; on expiry it emits REVIEW_TIMEOUT and still BLOCKS
# (only an audited --force overrides a BLOCK).
copilot_review:
  # `required` (not the `auto` default) because upstream 1.5.0 made shadow review
  # non-blocking by default and made requesting Copilot review optional. Under
  # `auto` the P-018 gate is NOT_APPLICABLE on any PR where Copilot was never
  # engaged, so unresolved review threads could ride through to merge. Copilot
  # reviews 100% of PRs in this repo (verified across PRs #394-#399), so forcing
  # the gate on carries no wedge risk.
  enforcement: "required"    # auto | required | disabled
  # Non-zero so the gate polls instead of returning WAITING_FOR_REVIEW the instant
  # a review has not landed yet. 900s matches the 15-minute Copilot review budget
  # documented in github-pr-automation.instructions.md §1.2.
  max_wait_seconds: 900      # integer >= 0

# Graphtor-docs capability pack (enabled 2026-08-31). `_resolve_graphtor_sources_path`
# and `_resolve_graphtor_binary_path` in verify_workspace.py read these from the
# PROFILE (not config.yaml), so they are declared here to pin the rendered
# GRAPHTOR_SOURCES_PATH / GRAPHTOR_BINARY_PATH values rather than relying on the
# on-disk candidate probe. The binary and sources registry are already provisioned
# under the gitignored .graphtor/ tree; all 8 tools the instruction file promises were
# verified present via `graphtor-docs manifest`.
graphtor_docs:
  sources_path: .graphtor/config/sources.yaml
  binary_path: .graphtor/bin/graphtor-docs.exe
  embed_model_dir: null

# Continuous-learning capability pack (enabled 2026-08-31). Mirrors the
# `continuous_learning` block in config.yaml, which is where
# `_derive_template_variables` reads CONTINUOUS_LEARNING_* from.
continuous_learning:
  directory: .autoharness/continuous-learning
  capture_hooks: false
  environment_adapter: none
  promotion_threshold: 5

# P-019 local quality-gate enforcement surface. Consumed by the pre-push and
# pre-commit hook scripts installed under scripts/ during the 2026-08-31 1.5.0
# merge-install pass. IMPORTANT: these scripts are OPT-IN. Nothing was written to
# .git/hooks and core.hooksPath was NOT set — P-019 forbids auto-installing hooks.
# An operator must wire them up explicitly; if both pre-commit scripts are adopted
# they must be chained from a single dispatcher hook.
local_gating:
  pre_push_enabled: false
  pre_push_gates:
    - "test"
    - "typecheck"
    - "lint"
    - "format"
    - "build"
  pre_commit_markdownlint_enabled: false
  pre_commit_pipeline_topology_enabled: false
  hooks_path_managed: false

# Ambient CI backstop (Gate C) for pipeline topology, added additively to the
# hand-written .github/workflows/ci.yml as the `topology-check` job. Advisory
# (continue-on-error) until the PIPELINE_TOPOLOGY_GATE_REQUIRED repository
# variable is set to 'true'.
ci_topology_gate:
  entrypoint: "scripts/ci-topology-check.sh"
  job_name: "topology-check"
  required_variable: "PIPELINE_TOPOLOGY_GATE_REQUIRED"
  required: false