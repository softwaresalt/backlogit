build:
  tool: "go"
  command: "go build ./cmd/backlogit"
  check_command: "go test -run=^$ -count=1 ./..."

test:
  runner: "go test"
  command: "go test ./..."
  directory: "tests/"

lint:
  tool: "golangci-lint"
  command: "golangci-lint run"

format:
  tool: "gofmt"
  command: "gofmt -l ."
  check_command: "gofmt -l ."
  fix_command: "gofmt -w ."

ci:
  platform: "GitHub Actions"
  pipeline_steps:
    - "build"
    - "test"
    - "lint"
  quality_gates:
    - "go test ./..."
    - "go vet ./..."
    - "golangci-lint run"

structure:
  source_layout: "cmd/, internal/, tests/"
  test_layout: "tests/ and colocated *_test.go files"
  doc_layout: "docs/"

runtime_surfaces:
  web_ui: false
  public_api: false
  background_jobs: false
  deployment_manifests: []

conventions:
  code_style:
    language: "Go"
    docs_required: true
    lint_zero_warnings: true
  git:
    commit_style: "conventional commits"
  documentation:
    durable_docs_root: "docs/"

