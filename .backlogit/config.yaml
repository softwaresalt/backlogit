artifact_types:
  feature:
    prefix: F
    name_format: "{prefix}{NNN}"
    allowed_children:
      - task
      - review
  deliberation:
    prefix: DL
    name_format: "{prefix}{NNN}"
  task:
    prefix: T
    name_format: "{prefix}{NNN}"
    allowed_children:
      - subtask
  review:
    prefix: R
    name_format: "{prefix}{NNN}"
    file_name_format: "{id}-{title_slug}"
    allowed_children: []
  subtask:
    prefix: ST
    name_format: "{prefix}{NNN}"
    allowed_children: []
  bug:
    prefix: B
    name_format: "{prefix}{NNN}"
    allowed_children: []
fields:
  status:
    type: enum
    values:
      - queued
      - active
      - blocked
      - review
      - done
      - accepted
      - rejected
      - archived
    default: queued
    optional: false
    external_map: {}
max_slug_length: 60
queue_layout:
  root_dir: queue
  levels:
    - level: 1
      types:
        - feature
        - deliberation
    - level: 2
      types:
        - task
        - review
    - level: 3
      types:
        - subtask
        - bug
  name_format: "{NNN}"
