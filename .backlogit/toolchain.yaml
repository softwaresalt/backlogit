schema_version: "1.0"
containment_level: "level-1-workspace-local-pinned"
os_container_sandbox_deferred: true
workspace_root: "."
tools:
  - id: "backlogit"
    kind: "mcp"
    containment_class: "workspace-local-pinned"
    executable_path: "./bin/backlogit.exe"
    pinned_version: "dev"
    sha256: "46974ea86852ea50c5e106b41dc7c773b27fbac4ba9b96d7a4f233084c386b27"
    workspace_binding_args:
      - "--cwd"
      - "."
  - id: "engram"
    kind: "mcp"
    containment_class: "workspace-local-pinned"
    executable_path: "./bin/engram.exe"
    pinned_version: "0.3.0-rc.1"
    sha256: "8859cf2b0b4378fa5e87e36a7797e379e6e5034618fe27898f307c20134cc876"
    workspace_binding_args:
      - "ENGRAM_DATA_DIR=.engram"
  - id: "graphtor-docs"
    kind: "mcp"
    containment_class: "workspace-local-pinned"
    executable_path: "./bin/kbdb.exe"
    pinned_version: "0.3.1"
    sha256: "7c243c9318e303cf2b8627f83881b47d6da01a5a2306f6814a975294a77663ab"
  - id: "context7"
    kind: "mcp"
    containment_class: "workspace-local-pinned"
    executable_path: "./bin/bun.exe"
    entrypoint_path: "tools/mcp/node_modules/@upstash/context7-mcp/dist/index.js"
    pinned_version: "4.4.4"
    sha256: "627d2e4775c24bdedee2cd7ccc18dcadae061e5345274ab6e3c4c797927bfb8f"
    lockfile_path: "tools/mcp/bun.lock"
  - id: "tavily"
    kind: "mcp"
    containment_class: "workspace-local-pinned"
    executable_path: "./bin/bun.exe"
    entrypoint_path: "tools/mcp/node_modules/tavily-mcp/build/index.js"
    pinned_version: "0.2.22"
    sha256: "627d2e4775c24bdedee2cd7ccc18dcadae061e5345274ab6e3c4c797927bfb8f"
    lockfile_path: "tools/mcp/bun.lock"
  - id: "github"
    kind: "mcp"
    containment_class: "workspace-local-pinned"
    executable_path: "./bin/github-mcp-server.exe"
    pinned_version: "1.5.0"
    sha256: "f4cf7866202c9542947c2fb62130ff41b2c089facd0337272f0b078cf1a903f6"
  - id: "bun"
    kind: "tool"
    containment_class: "workspace-local-pinned"
    executable_path: "./bin/bun.exe"
    entrypoint_path: "./tools/mcp/install.ps1"
    pinned_version: "1.4.0"
    sha256: "627d2e4775c24bdedee2cd7ccc18dcadae061e5345274ab6e3c4c797927bfb8f"
  - id: "bunx"
    kind: "tool"
    containment_class: "workspace-local-pinned"
    executable_path: "./bin/bunx.exe"
    entrypoint_path: "./tools/mcp/install.ps1"
    pinned_version: "1.4.0"
    sha256: "627d2e4775c24bdedee2cd7ccc18dcadae061e5345274ab6e3c4c797927bfb8f"
  - id: "graphtor-mcp-shim"
    kind: "tool"
    containment_class: "workspace-local-pinned"
    executable_path: "./bin/bun.exe"
    entrypoint_path: ".copilot/graphtor-mcp-shim.cjs"
    pinned_version: "1.4.0"
    sha256: "627d2e4775c24bdedee2cd7ccc18dcadae061e5345274ab6e3c4c797927bfb8f"
  - id: "agent-host"
    kind: "agent"
    containment_class: "built-in-host"
    reason: "Provided by the agent host, not a local executable"
host_prerequisites:
  - id: "pwsh"
    command: "pwsh"
    purpose: "workspace bootstrap"
    required: true
    reason: "host PowerShell runtime"
  - id: "bash"
    command: "bash"
    purpose: "workspace bootstrap"
    required: false
    reason: "host POSIX shell runtime"
  - id: "git"
    command: "git"
    purpose: "version control"
    required: true
    reason: "host git CLI"
  - id: "gh"
    command: "gh"
    purpose: "PR automation"
    required: false
    reason: "host GitHub CLI"
  - id: "go"
    command: "go"
    purpose: "Go toolchain"
    required: true
    reason: "host Go compiler"
  - id: "copilot"
    command: "copilot"
    purpose: "agent host"
    required: false
    reason: "host Copilot CLI"
