defaults:
  id:
    type: string
    immutable: true
  created_date:
    type: datetime
    immutable: true
  updated_date:
    type: datetime
    immutable: true
  status:
    type: enum
    values:
      - queued
      - active
      - blocked
      - review
      - done
      - accepted
      - rejected
      - archived
    default: queued
types:
  feature:
    prefix: F
    suffix: "-F"
    id_format: "{NNN}{suffix}"
    fields:
      harness_status:
        type: enum
        values:
          - pending
          - scaffolded
          - passing
          - failing
        default: pending
        optional: true
  deliberation:
    prefix: DL
    suffix: "-DL"
    id_format: "{NNN}{suffix}"
    fields:
      priority:
        type: enum
        values:
          - low
          - medium
          - high
          - critical
        default: medium
  task:
    prefix: T
    suffix: "-T"
    id_format: "{NNN}{suffix}"
    fields:
      priority:
        type: enum
        values:
          - low
          - medium
          - high
        default: medium
      size:
        type: enum
        values:
          - XS
          - S
          - M
          - L
          - XL
        optional: true
      size_source:
        type: enum
        values:
          - human
          - agent
          - derived
        optional: true
      size_ruleset_version:
        type: string
        optional: true
  review:
    prefix: R
    suffix: "-R"
    id_format: "{NNN}{suffix}"
    fields:
      status:
        type: enum
        values:
          - queued
          - active
          - blocked
          - review
          - done
          - accepted
          - rejected
          - archived
        default: queued
      source_branch:
        type: string
        optional: true
  subtask:
    prefix: ST
    suffix: "-ST"
    id_format: "{NNN}{suffix}"
    fields:
  bug:
    prefix: B
    suffix: "-B"
    id_format: "{NNN}{suffix}"
    fields:
      severity:
        type: enum
        values:
          - low
          - medium
          - high
          - critical
        default: medium
  shipment:
    prefix: S
    suffix: "-S"
    id_format: "{NNN}{suffix}"
    fields:
      status:
        type: enum
        values:
          - queued
          - active
          - shipped
          - abandoned
        default: queued
      branch:
        type: string
        optional: true
      items:
        type: list
        optional: true
